<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>고고모바일 번호이동 신청서 다운로드</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #f4f6f9;
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.12);
      padding: 44px 40px;
      width: min(520px, calc(100vw - 32px));
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eef2ff;
      color: #2563eb;
      border: 1px solid #c7d2fe;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin: 0 0 8px;
    }
    p.sub {
      color: #4b5563;
      font-size: 13px;
      margin: 0 0 26px;
      line-height: 1.55;
    }
    .meta {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 16px 18px;
      text-align: left;
      margin-bottom: 24px;
    }
    .meta div {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 13px;
      border-bottom: 1px dashed #e5e7eb;
    }
    .meta div:last-child { border-bottom: none; }
    .meta .label { color: #6b7280; }
    .meta .value { color: #111827; font-weight: 600; }
    .actions { display: grid; gap: 10px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-primary {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.25);
    }
    .btn-secondary {
      background: #ffffff;
      color: #111827;
      border: 1px solid #d1d5db;
    }
    .note {
      margin-top: 18px;
      font-size: 11px;
      color: #9ca3af;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">📄 고고모바일 MNP</div>
    <h1>번호이동 신청서</h1>
    <p class="sub">KT → 고고모바일(KT망) 번호이동 해제용 신청서입니다. 아래 버튼으로 다운로드 후 인쇄하여 사용하세요.</p>

    <div class="meta">
      <div><span class="label">신청인</span><span class="value">송준호</span></div>
      <div><span class="label">전화번호</span><span class="value">010-6206-5023</span></div>
      <div><span class="label">현 통신사</span><span class="value">KT</span></div>
      <div><span class="label">이동 통신사</span><span class="value">고고모바일 (KT망 MVNO)</span></div>
      <div><span class="label">신청서명</span><span class="value">번호이동_신청서_고고모바일.pdf</span></div>
      <div><span class="label">작성일</span><span class="value">2026.06.05</span></div>
    </div>

    <div class="actions">
      <a class="btn btn-primary" href="/output/번호이동_신청서_고고모바일.pdf" download>⬇ PDF 다운로드</a>
      <a class="btn btn-secondary" href="/output/번호이동_신청서_고고모바일.pdf" target="_blank">브라우저에서 미리보기</a>
    </div>

    <p class="note">다운로드가 시작되지 않으면 브라우저 미리보기로 열어 저장해 주세요.<br/>제출: rnp@ktoa.or.kr / 팩스: 02-541-4370 / 대리점: 1533-6723</p>
  </div>
</body>
</html>
